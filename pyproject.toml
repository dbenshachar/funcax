[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funcax"
version = "0.1.0"
description = "Functional utilities built with JAX."
requires-python = ">=3.10"
dependencies = ["jax"]

[tool.setuptools.packages.find]
where = ["."]
include = ["funcax*"]
